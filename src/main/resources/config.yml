# ============================================
#  Omar 反矿透插件 配置文件
# ============================================

# 检测时间窗口（秒）
# 在此时间范围内统计玩家挖掘的矿石数量
# 默认: 120 (2分钟)
time-window: 120

# 矿石全局阈值
# 在时间窗口内挖掘超过此数量的目标矿石即触发警报
# 可在下方为每种矿石设置独立阈值（设为0则使用此全局值）
# 默认: 5
ore-threshold: 5

# 重点汇报时间窗口（秒）
# 在此时间范围内被连续汇报多次即升格为重点汇报
# 默认: 300 (5分钟)
priority-time-window: 300

# 重点汇报次数阈值
# 在重点汇报时间窗口内被汇报达到此次数即升格
# 默认: 3
priority-report-threshold: 3

# 矿石独立阈值
# 设为 0 则使用全局 ore-threshold
ore-thresholds:
  diamond_ore: 0
  deepslate_diamond_ore: 0
  ancient_debris: 0

# 是否警告被重点关注的玩家
# true = 插件会自动私聊警告该玩家
# false = 不警告玩家，仅通知管理员
warn-suspected-player: true

# 绕过白名单
# 列入此名单的玩家不会被检测
bypass-players:
  # - "BuilderSteve"

# 自动处理措施（默认关闭）
# 当玩家触发重点汇报时自动执行的操作
# action 可选: none / kick / ban / command
# command 仅当 action 为 command 时生效，%player% 会被替换为玩家名
auto-action:
  enabled: false
  action: "none"
  command: "tempban %player% 1d 矿透作弊"
  message: "&#f38ba8您因矿透嫌疑已被移出服务器"

# 声音通知
# 当警报触发时向管理员播放提示音
sound-notification:
  enabled: true
  sound: "BLOCK_NOTE_BLOCK_PLING"
  volume: 1.0
  pitch: 1.0

# 汇报管理员列表（玩家名）
# 此处列出的玩家拥有接收警报和查看记录的权限
# 也可以通过 /omar add <玩家> 命令添加
admins:
  - "Notch"

# ============================================
#  消息文本配置
#  支持 hex 配色: &#RRGGBB
#  常用配色参考:
#    绿色 &#a6e3a1    红色 &#f38ba8
#    黄色 &#f9e2af    灰色 &#9399b2
#    金色 &#fab387
# ============================================
messages:
