  prefix: "&#9399b2[&#fab387Omar&#9399b2]"

  # 权限不足
  no-permission: "&#f38ba8你没有权限执行此命令！"

  # 玩家未找到
  player-not-found: "&#f38ba8未找到该玩家！"

  # 玩家已是管理员
  already-admin: "&#f38ba8该玩家已经是汇报管理员了！"

  # 玩家不是管理员
  not-admin: "&#f38ba8该玩家不是汇报管理员！"

  # 添加管理员成功
  admin-added: "&#a6e3a1已将 &#a6e3a1%player% &#a6e3a1添加为汇报管理员！"

  # 移除管理员成功
  admin-removed: "&#a6e3a1已将 &#a6e3a1%player% &#a6e3a1移除汇报管理员权限！"

  # 矿透警告（发送给管理员）
  report-alert: "&#9399b2[&#fab387矿透警告&#9399b2] &#a6e3a1%player% &#f9e2af有开矿透嫌疑！"

  # 鼠标悬停提示文本（在聊天栏中点击警报时显示）
  report-hover-text: "&#a6e3a1点击传送至最后一块矿石位置"

  # 重点汇报警报（发送给管理员）
  priority-report-alert: "&#9399b2[&#f38ba8&l重点警告&#9399b2] &#a6e3a1%player% &#f9e2af已被多次汇报！累计 &#f38ba8%count% &#f9e2af次，请重点关注！"

  # 重点汇报悬停提示文本
  priority-report-hover-text: "&#a6e3a1点击传送至最后位置"

