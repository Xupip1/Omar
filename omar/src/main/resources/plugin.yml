name: Omar
version: 1.0.0
main: com.omar.plugin.OmarPlugin
api-version: 1.21
folia-supported: false
author: OmarPlugin
description: 反矿透检测插件 - 检测玩家是否使用矿透作弊

commands:
  omar:
    description: Omar 反矿透插件主命令
    usage: /omar <add|remove|log|imlog|check|bypass|stats|delete|reload|panel|help>
    aliases: []

permissions:
  omar.admin:
    description: 拥有所有 Omar 插件权限
    default: op
    children:
      omar.command.*: true
      omar.report.receive: true

  omar.command.*:
    description: 所有命令权限
    default: op
    children:
      omar.command.add: true
      omar.command.remove: true
      omar.command.log: true
      omar.command.imlog: true
      omar.command.check: true
      omar.command.bypass: true
      omar.command.stats: true
      omar.command.delete: true
      omar.command.reload: true
      omar.command.help: true
      omar.command.tp: true
      omar.command.panel: true

  omar.command.add:
    description: 添加汇报管理员
    default: op

  omar.command.remove:
    description: 移除汇报管理员
    default: op

  omar.command.log:
    description: 打开汇报记录面板
    default: op

  omar.command.imlog:
    description: 打开重点汇报记录面板
    default: op

  omar.command.check:
    description: 查询玩家的汇报记录
    default: op

  omar.command.bypass:
    description: 管理白名单
    default: op

  omar.command.stats:
    description: 查看插件统计信息
    default: op

  omar.command.delete:
    description: 删除所有汇报记录
    default: op

  omar.command.reload:
    description: 重载配置文件
    default: op

  omar.command.help:
    description: 查看帮助信息
    default: op

  omar.command.tp:
    description: 传送至矿道位置（内部使用）
    default: op

  omar.command.panel:
    description: 打开管理面板
    default: op

  omar.report.receive:
    description: 接收矿透警报和查看汇报记录
    default: op
